spring.application.name=web-educAlba-backend

spring.jpa.open-in-view=false

# En tests, cada ejecucion parte de un contenedor Testcontainers limpio,
# asi que se puede recrear el esquema desde cero sin riesgo
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Configuracion de correo para tests: valores ficticios, nunca se envia
# un email real porque JavaMailSender se sustituye por un doble de prueba
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.contact-recipient=test@example.com
app.mail.from-address=no-reply@educalba.es

app.remember-me.key=test-remember-me-key
app.frontend.base-url=http://localhost:5173
