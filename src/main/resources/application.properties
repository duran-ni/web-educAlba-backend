spring.application.name=web-educAlba-backend

# No cargar entidades relacionadas fuera de las transacciones (evita errores de LazyInitializationException
# y fuerza a traer explicitamente los datos relacionados que se necesiten, mejor practica de rendimiento)
spring.jpa.open-in-view=false

# En desarrollo, Hibernate actualiza el esquema automaticamente segun las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ejecuta data.sql tambien con bases de datos externas (por defecto Spring Boot
# solo lo hace con bases de datos embebidas, y nosotros usamos Postgres via Docker)
spring.sql.init.mode=always

# Espera a que Hibernate cree las tablas antes de ejecutar data.sql,
# evitando el error de "la tabla todavia no existe"
spring.jpa.defer-datasource-initialization=true

# Configuracion SMTP para el envio automatico de emails del formulario de contacto.
# El usuario y la contrasena se leen de variables de entorno del sistema,
# nunca se escriben aqui en claro para no exponerlos en el repositorio.
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Direccion a la que llegan los avisos de nuevos mensajes de contacto.
# Con Mailtrap Sandbox, el destinatario no importa: todos los correos
# se interceptan igualmente y aparecen en la bandeja de pruebas.
app.mail.contact-recipient=contacto@educalba.es
app.mail.from-address=no-reply@educalba.es

# Clave secreta para firmar la cookie "remember-me" (sesion persistente tras
# cerrar el navegador). En produccion debe definirse via variable de entorno;
# el valor por defecto solo es apto para desarrollo local
app.remember-me.key=${REMEMBER_ME_KEY:educalba-remember-me-dev-key}
