spring.application.name=web-educAlba-backend

# No cargar entidades relacionadas fuera de las transacciones (evita errores de LazyInitializationException
# y fuerza a traer explicitamente los datos relacionados que se necesiten, mejor practica de rendimiento)
spring.jpa.open-in-view=false

# En desarrollo, Hibernate actualiza el esquema automaticamente segun las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ejecuta data.sql tambien con bases de datos externas (por defecto Spring Boot
# solo lo hace con bases de datos embebidas, y nosotros usamos Postgres via Docker)
spring.sql.init.mode=always

# Espera a que Hibernate cree las tablas antes de ejecutar data.sql,
# evitando el error de "la tabla todavia no existe"
spring.jpa.defer-datasource-initialization=true

# Configuracion SMTP para el envio automatico de emails (formulario de
# contacto, solicitudes de interes e inscripciones a talleres).
# Se envia a traves de Gmail/Google Workspace con la cuenta real de la
# academia. El usuario y la contrasena (una "contrasena de aplicacion" de
# Gmail, no la contrasena normal de la cuenta) se leen de variables de
# entorno del sistema, nunca se escriben aqui en claro para no exponerlos
# en el repositorio.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Direccion real de la academia: tanto remitente como destinataria de los
# avisos (formulario de contacto, solicitudes de interes e inscripciones)
app.mail.contact-recipient=refuerzoeducalba@gmail.com
app.mail.from-address=refuerzoeducalba@gmail.com

# Clave secreta para firmar la cookie "remember-me" (sesion persistente tras
# cerrar el navegador). En produccion debe definirse via variable de entorno;
# el valor por defecto solo es apto para desarrollo local
app.remember-me.key=${REMEMBER_ME_KEY:educalba-remember-me-dev-key}

# URL base del frontend, usada para construir el enlace de restablecimiento
# de contrasena que se envia por email
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Credenciales de Cloudinary para la gestion de imagenes de la galeria.
# Se leen de variables de entorno del sistema, nunca se escriben aqui en
# claro para no exponerlas en el repositorio (igual que con el correo SMTP)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Limite de tamaño por archivo y por peticion para subidas multipart
# (fotos de la Galeria). El valor por defecto de Spring Boot es de solo 1MB,
# insuficiente para fotos de movil, lo que provocaba un error 500 al subir
# fotos de mas de 1MB
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
