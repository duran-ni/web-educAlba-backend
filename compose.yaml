services:
  postgres:
    image: 'postgres:17'
    container_name: educalba-postgres
    environment:
      - 'POSTGRES_DB=educalba'
      - 'POSTGRES_USER=educalba'
      - 'POSTGRES_PASSWORD=educalba'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
